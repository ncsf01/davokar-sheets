{% extends "base.html" %}

{% block title %}My characters{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <h1 class="mb-0">My characters</h1>
  <a class="btn btn-primary" href="{{ url_for('characters.new') }}">+ New character</a>
</div>

<div class="card">
  {% if characters %}
    {% include "characters/_list.html" %}
  {% else %}
    <div class="card-body text-secondary fst-italic">
      No characters yet. <a href="{{ url_for('characters.new') }}">Create your first one.</a>
    </div>
  {% endif %}
</div>
{% endblock %}
