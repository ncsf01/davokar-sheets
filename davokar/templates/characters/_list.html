<div class="list-group list-group-flush">
  {% for c in characters %}
  <a class="list-group-item list-group-item-action d-flex align-items-center gap-3" href="{{ url_for('characters.view', character_id=c.id) }}">
    <span class="medal">{{ c.name[:1] | upper }}</span>
    <span>
      <span class="d-block fs-5 font-display">{{ c.name }}</span>
      <small class="text-secondary">{{ [c.race, c.occupation] | select | join(" · ") }}</small>
    </span>
  </a>
  {% endfor %}
</div>
