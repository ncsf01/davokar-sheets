{% extends "base.html" %}

{% block title %}Delete {{ character.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card border-danger">
      <div class="card-body p-4">
        <h1 class="h3">Delete {{ character.name }}?</h1>
        <p>This removes the character sheet permanently. It cannot be undone.</p>

        <form method="post" class="d-flex gap-2">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-danger" type="submit">Delete permanently</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('characters.view', character_id=character.id) }}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
