{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h2 mb-4">Log in</h1>

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label" for="login">Username or email</label>
            <input class="form-control" id="login" name="login" value="{{ login_value }}" autocomplete="username" required autofocus>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>

        <p class="text-center text-secondary mt-3 mb-0">
          No account yet? <a href="{{ url_for('auth.register') }}">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
